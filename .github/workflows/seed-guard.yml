name: Seed guard

# Blocks PRs into main that break or shrink the data files
# (see the 27 Sep 2026 51c7547 wipe: main seed 1805 → 12 players).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: seed-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  seed-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Default ref is refs/pull/N/merge: HEAD = what main would become, HEAD^1 = main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            scripts/seed_guard.py
            data/seed.json
            data/article-uploads.json
          sparse-checkout-cone-mode: false
      - name: Check seed.json / article-uploads.json
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 scripts/seed_guard.py --base-rev HEAD^1 --head-rev HEAD
